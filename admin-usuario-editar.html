<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Rancho - Editar Usuario</title>
    <link rel="stylesheet" href="style/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body class="bg-light">

    <nav class="navbar body-bg-primary">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold" href="admin-index.html">Dino Rancho <span class="badge bg-dark fs-6 ms-2">ADMIN</span></a>
            <a href="index.html" class="btn btn-outline-dark btn-sm fw-bold">Volver a la Tienda</a>
        </div>
    </nav>

    <nav class="navbar navbar-expand-lg navbar-color navbar-dark">
        <div class="container-fluid">
            <div class="collapse navbar-collapse" id="navbarNavAdmin">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="admin-index.html">Dashboard Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin-productos.html">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="admin-usuarios.html">Usuarios</a>
                    </li>
                </ul>  
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-success text-white text-center py-3">
                        <h3 class="mb-0 fs-4">Editar Usuario</h3>
                    </div>
                    <div class="card-body p-4">
                        <form id="editarUsuarioForm" novalidate>
                            <div class="mb-3">
                                <label for="idUsuario" class="form-label fw-semibold">ID Usuario</label>
                                <input type="text" class="form-control" id="idUsuario" value="1" readonly disabled>
                            </div>

                            <div class="mb-3">
                                <label for="nombreUsuario" class="form-label fw-semibold">Nombre Completo *</label>
                                <input type="text" class="form-control" id="nombreUsuario" value="Juan Pérez" maxlength="50" required>
                                <div class="invalid-feedback" id="errorNombre">
                                    El nombre es obligatorio (máximo 50 caracteres).
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="correoUsuario" class="form-label fw-semibold">Correo Electrónico *</label>
                                <input type="email" class="form-control" id="correoUsuario" value="juan.perez@duocuc.cl" maxlength="100" required>
                                <div class="invalid-feedback" id="errorCorreo">
                                    Debe ingresar un correo válido terminado en @duocuc.cl.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="fechaNacimiento" class="form-label fw-semibold">Fecha de Nacimiento *</label>
                                <input type="date" class="form-control" id="fechaNacimiento" value="1995-06-15" required>
                                <div class="invalid-feedback" id="errorFecha">
                                    El usuario debe ser mayor de 18 años.
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6 mb-3 mb-md-0">
                                    <label for="rolUsuario" class="form-label fw-semibold">Rol / Permisos *</label>
                                    <select class="form-select" id="rolUsuario" required>
                                        <option value="Cliente" selected>Cliente</option>
                                        <option value="Administrador">Administrador</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="estadoUsuario" class="form-label fw-semibold">Estado *</label>
                                    <select class="form-select" id="estadoUsuario" required>
                                        <option value="Activo" selected>Activo</option>
                                        <option value="Inactivo">Inactivo</option>
                                    </select>
                                </div>
                            </div>

                            <div id="formStatus" class="alert d-none mt-3" role="alert"></div>

                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-success flex-fill fs-6 fw-bold">Guardar Cambios</button>
                                <a href="admin-usuarios.html" class="btn btn-outline-secondary flex-fill fs-6 fw-bold text-center d-flex align-items-center justify-content-center">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/admin-usuario-editar.js"></script>
</body>
</html>
