<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Dino Rancho - Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <nav id="navbar-container">
            </nav>
    </header>

    <main class="login-container">
        <section class="login-card">
            <div class="brand-header">
                <div class="logo-box">
                </div>
                <h1>Dino Rancho</h1>
            </div>

            <h2>Iniciar Sesión</h2>

            <form id="loginForm" novalidate>
                
                <div class="form-group">
                    <label for="correo">Correo Electrónico *</label>
                    <input 
                        type="email" 
                        id="correo" 
                        name="correo" 
                        maxlength="100" 
                        placeholder="ejemplo@duoc.cl" 
                        autocomplete="email"
                        required
                    >
                    <span class="error-message" id="errorCorreo"></span>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña *</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        maxlength="10" 
                        placeholder="••••••••" 
                        autocomplete="current-password"
                        required
                    >
                    <span class="error-message" id="errorPassword"></span>
                </div>

                <div id="formStatus" class="status-message"></div>

                <button type="submit" class="btn-submit">Ingresar a la Cueva 🦖</button>
            </form>

            <div class="login-footer-links">
                <p>¿No tienes cuenta? <a href="#">Regístrate aquí</a></p>
            </div>
        </section>
    </main>


    <script src="login.js"></script>
</body>
</html>
